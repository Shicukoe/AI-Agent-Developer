<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>AutoPilot Admin · Đăng nhập</title>
    <link rel="icon" href="assets/img/favicon32.png" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="assets/scss/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column h-100 theme-blue">
    <div class="coverimg h-100 w-100 top-0 start-0 main-bg position-fixed">
        <div class="bg-blur main-bg-overlay"></div>
        <img src="assets/img/bg-14.jpg" alt="" />
    </div>

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh">
            <div class="col-11 col-sm-8 col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <img src="assets/img/favicon72.png" alt="" class="mb-3" />
                            <h5 class="mb-1">AutoPilot Admin</h5>
                            <p class="text-secondary small">Nhập token quản trị để tiếp tục</p>
                        </div>
                        <form id="loginForm">
                            <div class="form-group form-floating-custom mb-3">
                                <label class="form-label">Admin API Token</label>
                                <div class="input-group">
                                    <span class="input-group-text text-theme"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="tokenInput" placeholder="Dán token ở đây" autocomplete="off" required>
                                </div>
                            </div>
                            <div class="alert alert-danger d-none" id="loginError"></div>
                            <button type="submit" class="btn btn-theme w-100">Đăng nhập</button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-secondary small mt-3">Token được cấu hình qua <code>ADMIN_API_TOKEN</code> trong .env</p>
            </div>
        </div>
    </div>

    <script src="assets/js/jquery-3.3.1.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Đã có token → vào thẳng dashboard.
        if (AdminApi.getToken()) location.href = 'index.html';

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var token = document.getElementById('tokenInput').value.trim();
            var errBox = document.getElementById('loginError');
            errBox.classList.add('d-none');
            if (!token) return;
            AdminApi.setToken(token);
            try {
                await AdminApi.get('/stats'); // xác thực token
                location.href = 'index.html';
            } catch (err) {
                AdminApi.clearToken();
                errBox.textContent = 'Token không hợp lệ hoặc server chưa bật admin API.';
                errBox.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
