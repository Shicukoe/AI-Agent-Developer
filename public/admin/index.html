<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>AutoPilot Admin · Tasks</title>
    <link rel="icon" href="assets/img/favicon32.png" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="assets/scss/style.css" rel="stylesheet">
    <style>
      :root { --ap-accent: #2563eb; --ap-accent2: #06b6d4; }
      /* Card mượt hơn: bo góc, viền nhạt, đổ bóng nhẹ, hover nhấc lên. */
      .main .card { border: 1px solid rgba(37,99,235,.08); border-radius: 16px; box-shadow: 0 6px 22px rgba(15,23,42,.06); transition: transform .15s ease, box-shadow .15s ease; }
      .main .card:hover { box-shadow: 0 10px 30px rgba(15,23,42,.10); }
      .title { font-weight: 700; letter-spacing: -.02em; }
      /* KPI: avatar nền gradient cho nổi. */
      #kpiRow .avatar { background-image: linear-gradient(135deg, rgba(37,99,235,.14), rgba(6,182,212,.14)); }
      #kpiRow h4 { font-weight: 800; letter-spacing: -.02em; }
      /* Thẻ usage có dải gradient mảnh trên đỉnh. */
      #usageCard { position: relative; overflow: hidden; }
      #usageCard::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--ap-accent), var(--ap-accent2)); }
      /* Tile bên trong usage. */
      .ap-tile { background: linear-gradient(180deg, #fbfdff, #f4f8ff); border: 1px solid rgba(37,99,235,.10); border-radius: 14px; }
      /* Gauge tròn % cửa sổ 5h. */
      .ap-gauge { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; }
      .ap-gauge-hole { width: 100px; height: 100px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(15,23,42,.05); }
      .ap-gauge-num { font-size: 2rem; font-weight: 800; color: #0f172a; line-height: 1; letter-spacing: -.03em; }
      .ap-gauge-pct { font-size: .9rem; font-weight: 700; color: #64748b; margin-left: 2px; }
      /* Thanh token theo khâu. */
      .ap-stage { margin-bottom: 14px; }
      .ap-stage:last-child { margin-bottom: 0; }
      .ap-stage-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .ap-stage-name { font-weight: 600; font-size: .9rem; color: #1e293b; display: inline-flex; align-items: center; }
      .ap-stage-val { font-weight: 700; font-size: .9rem; color: #0f172a; }
      .ap-stage-ic { width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; color: #fff; margin-right: 8px; font-size: .85rem; box-shadow: 0 3px 8px rgba(15,23,42,.18); }
      .ap-bar { height: 10px; border-radius: 999px; background: #e9edf5; overflow: hidden; }
      .ap-bar-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.4,0,.2,1); }
    </style>
</head>

<body class="d-flex flex-column h-100 sidebar-pushcontent theme-blue" data-sidebarstyle="sidebar-pushcontent">

    <div id="app-shell" data-title="Quản lý Task"></div>

    <main class="main">
        <div class="container-fluid mainheight">
            <div class="row align-items-center mb-1">
                <div class="col">
                    <h4 class="title mb-0">Quản lý Task</h4>
                </div>
                <div class="col-auto">
                    <button class="btn btn-light-theme" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i>Làm mới</button>
                </div>
            </div>
            <p class="text-secondary small mb-4 mt-2">Trạng thái các task của agent, token đã dùng và các thao tác xử lý task.</p>

            <!-- KPI cards -->
            <div class="row" id="kpiRow">
                <div class="col-12 text-center text-secondary py-3">Đang tải số liệu…</div>
            </div>

            <!-- Token & chi phí (gộp mọi repo) -->
            <div class="card mt-2" id="usageCard">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0 fw-bold"><i class="bi bi-coin me-1 text-theme"></i>Token theo khâu &amp; cửa sổ session 5h</h6>
                        <span class="text-secondary fs-12" id="usageHint"></span>
                    </div>
                    <div id="usageBody" class="text-secondary small">Đang tải…</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="card mt-3">
                <div class="card-body">
                    <div class="row g-2 align-items-center">
                        <div class="col-12 col-md-auto">
                            <div class="btn-group flex-wrap" role="group" id="filterGroup">
                                <button class="btn btn-sm btn-outline-theme active" data-filter="problems">Có vấn đề</button>
                                <button class="btn btn-sm btn-outline-theme" data-filter="">Tất cả</button>
                                <button class="btn btn-sm btn-outline-theme" data-filter="developing,testing,processing">Đang chạy</button>
                                <button class="btn btn-sm btn-outline-theme" data-filter="awaiting_plan_approval,plan_approved">Plan</button>
                                <button class="btn btn-sm btn-outline-theme" data-filter="completed">Hoàn thành</button>
                            </div>
                        </div>
                        <div class="col">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text text-theme"><i class="bi bi-search"></i></span>
                                <input type="search" class="form-control" id="searchInput" placeholder="Tìm theo tên card…">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tasks table -->
            <div class="card mt-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Card</th>
                                    <th>Dự án</th>
                                    <th>Loại</th>
                                    <th>Trạng thái</th>
                                    <th>Branch</th>
                                    <th>Cập nhật</th>
                                    <th class="text-end">Lỗi</th>
                                </tr>
                            </thead>
                            <tbody id="tasksBody">
                                <tr><td colspan="7" class="text-center text-secondary py-4">Đang tải…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="assets/js/jquery-3.3.1.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tasks.js"></script>
</body>

</html>
